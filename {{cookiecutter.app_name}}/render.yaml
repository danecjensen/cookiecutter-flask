services:
  # Web Service
  - type: web
    name: {{cookiecutter.app_name}}
    runtime: python
    env: python
    region: oregon  # Choose your preferred region
    plan: free  # Change to 'starter' or other plans as needed
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn {{cookiecutter.app_name}}.app:create_app() -b 0.0.0.0:$PORT -w 3"
    envVars:
      - key: FLASK_APP
        value: autoapp.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: {{cookiecutter.app_name}}-db
          property: connectionString
      - key: GUNICORN_WORKERS
        value: 3
      - key: LOG_LEVEL
        value: info
      - key: SEND_FILE_MAX_AGE_DEFAULT
        value: 31556926
      - key: PYTHON_VERSION
        value: "{{cookiecutter.python_version}}"

  # PostgreSQL Database
  - type: pserv
    name: {{cookiecutter.app_name}}-db
    runtime: postgres
    region: oregon  # Should match web service region
    plan: free  # Change to 'starter' or other plans as needed
    ipAllowList: []  # Leave empty to allow all IPs or add specific IPs
    postgresMajorVersion: 16
